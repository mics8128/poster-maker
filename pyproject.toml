[project]
name = "poster-maker"
version = "0.1.1"
description = "Cross-platform poster tiling tool for PDF/images"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
]

[project.scripts]
poster-maker = "poster_maker.app:main"
poster-maker-cli = "poster_maker.core:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
