[package]
name = "poster-maker"
version = "0.2.1"
description = "Image poster tiling tool"
authors = ["mics"]
edition = "2021"
default-run = "poster-maker"

[lib]
name = "poster_maker_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poster-maker-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
