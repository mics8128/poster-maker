name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to release, e.g. v0.2.0-alpha.2"
        required: true
        default: "v0.2.0-alpha.2"

permissions:
  contents: write

jobs:
  build-macos-apple-silicon:
    name: Build macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node -e "let p=require('./package.json'); p.version='${GITHUB_REF_NAME#v}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          pnpm sync-version
          cargo update --manifest-path src-tauri/Cargo.toml -p poster-maker

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin

      - name: Build CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin poster-maker-cli --target aarch64-apple-darwin

      - name: Stage CLI artifact
        shell: bash
        run: |
          mkdir -p cli-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/poster-maker-cli cli-artifacts/poster-maker-cli-aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: cli-aarch64-apple-darwin
          path: cli-artifacts/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-macos-apple-silicon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: Poster Maker ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/**/*
