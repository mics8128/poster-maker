name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to release, e.g. v0.2.0-alpha.1"
        required: true
        default: "v0.2.0-alpha.1"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-13
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Build CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin poster-maker-cli --target ${{ matrix.target }}

      - name: Stage CLI artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p cli-artifacts
          cp "src-tauri/target/${{ matrix.target }}/release/poster-maker-cli" "cli-artifacts/poster-maker-cli-${{ matrix.target }}"

      - name: Stage CLI artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cli-artifacts | Out-Null
          Copy-Item "src-tauri\target\${{ matrix.target }}\release\poster-maker-cli.exe" "cli-artifacts\poster-maker-cli-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: cli-artifacts/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: Poster Maker ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/**/*
