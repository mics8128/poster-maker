name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing, unreleased tag to publish, e.g. v0.3.2. For build-only checks use CI instead."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate new release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate tag and preserve existing releases
        id: source
        shell: bash
        run: |
          node scripts/assert-new-release.mjs
          # Resolve the exact existing tag, not the branch selected for a manual run.
          sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git checkout --detach "$sha"
          node scripts/sync-version.mjs --check "--tag=${RELEASE_TAG}"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build:
    name: Build release installers
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  publish:
    name: Publish verified GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true

      - name: Prepare and checksum both installers
        shell: bash
        run: |
          mkdir release-files
          version="${RELEASE_TAG#v}"
          # Explicit filenames fail closed if either platform artifact is missing.
          # Normalize spaces before checksumming; GitHub also normalizes asset names.
          cp "artifacts/Poster Maker_${version}_aarch64.dmg" "release-files/Poster.Maker_${version}_aarch64.dmg"
          cp "artifacts/Poster Maker_${version}_x64-setup.exe" "release-files/Poster.Maker_${version}_x64-setup.exe"
          cd release-files
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create draft, verify uploaded files, then publish
        shell: bash
        run: |
          node scripts/assert-new-release.mjs
          # Detect a tag moved while the installers were building.
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          node scripts/publish-release.mjs release-files
